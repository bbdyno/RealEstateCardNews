site:
  brand: 집값레이더                    # 2026-09-30 확정
  tagline: 전국 아파트·오피스텔·빌라 실거래가와 재개발, 매일 갱신
  base_url: https://jipgapradar.kr     # 2026-09-30 등록(가비아). 사이트맵·canonical 에 쓰인다
  contact_email: ""                    # 광고·제휴 문의 메일(비우면 문의 페이지에 '준비 중')
  instagram: ""                        # 인스타 핸들(@ 없이). 비우면 링크를 숨긴다

ads:                                   # docs/MONETIZATION.md 3절. 값이 비어 있으면 그 광고는 그리지 않는다(승인 전에는 비워 둔다)
  adsense:
    client: "ca-pub-8965771939775493"  # 기존 애드센스 계정(2026-10-01 연결). ads.txt 도 이 값으로 만든다
    # 자동 광고: client 만 넣으면 모든 페이지 <head> 에 애드센스 코드가 들어간다. 그다음 애드센스 화면 → 광고 → 사이트별
    # '자동 광고'에서 전면 광고(페이지 이동 사이 전체 화면, vignette)·앵커(하단 고정)·사이드 레일을 켜면 코드 수정 없이 붙는다.
    slots:                             # 애드센스에서 만든 '디스플레이' 광고 단위 번호(반응형)
      top: ""                          # 요약 아래 첫 광고
      mid: ""                          # 본문 중간
      bottom: ""                       # 바닥글 위
      list: ""                         # 긴 목록(신고가 등) 10줄마다, 최대 2번
      related: ""                      # '멀티플렉스' 광고 단위 번호 — 페이지 끝 추천 광고 묶음(autorelaxed)
  adfit:                               # 카카오 애드핏(초대·승인제). 애드센스가 채우지 못한 자리에만 순서대로 넣는다
    units:                             # 자리별 {id: DAN-..., w: 320, h: 100} — 웹 배너 크기 320x100·300x250·728x90 등
      top: {}
      mid: {}
      bottom: {}
      list: {}
  coupang:                             # 쿠팡 파트너스. 켜면 대가성 고지 문구가 블록 맨 위에 자동으로 붙는다
    enabled: false
    banners:                           # 쿠팡에서 받은 배너 코드(iframe). 맥락: 책 · 이사 · 가전. 빈 맥락은 book 으로 대신한다
      book: ""
      move: ""
      appliance: ""

analytics:
  ga4: ""                              # 구글 애널리틱스 4 측정 ID(G-XXXXXXXXXX)

verify:                                # 검색 등록 소유 확인 메타 태그의 content 값
  google: ""
  naver: "475840f2435b764e6005e9c22968d65bf715d83f"   # 네이버 서치어드바이저 HTML 태그(2026-10-01)

build:
  highs_days: 60                       # 신고가 목록에 넣을 최근 기간
  budget_months: 6                     # 예산별 표에 넣을 최근 거래 기간
  budget_max_eok: 30                   # 이 이상은 '30억 이상'으로 묶는다
  tiers:                               # 단지 페이지 등급(3년 매매+전월세 건수). docs/MONETIZATION.md 2절
    thin_max: 9                        # 이하이면 단지 페이지를 만들지 않고 시군구 페이지로 보낸다(3년 10건 미만)
    rich_min: 20                       # 이상이면 광고를 최대 개수까지(미만은 1개)
