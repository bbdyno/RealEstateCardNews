# 인스타 카드뉴스 자동 게시(한국 시각): 08:10 랭킹(요일마다 형식) · 12:10 예산표 · 15:40 랭킹2(다른 형식·시도)
# · 19:40 '현금으로 어디까지' · 21:40 예산표2.
# 맥(launchd)이 정시에 이 워크플로를 부르고, 아래 예약은 맥이 꺼져 있을 때의 대비다(GitHub 예약은 몇 시간씩 밀린다).
# 같은 날 같은 시리즈는 media 브랜치 log.json 으로 한 번만 올린다. 06:00 정기 실행이 갱신한 DB 로 카드를 만들고
# 자동 검수(cards/check.py)를 통과하면 @jipgapradar 에 올린 뒤 텔레그램으로 알린다. 실패해도 알린다.
# Secrets: IG_ACCESS_TOKEN · TELEGRAM_BOT_TOKEN · TELEGRAM_CHAT_ID
name: post

on:
  schedule:
    - cron: "10 23 * * *"         # UTC 23:10 = KST 08:10 랭킹
    - cron: "10 3 * * *"          # UTC 03:10 = KST 12:10 예산표
    - cron: "40 6 * * *"          # UTC 06:40 = KST 15:40 랭킹2
    - cron: "40 10 * * *"         # UTC 10:40 = KST 19:40 현금으로 어디까지
    - cron: "40 12 * * *"         # UTC 12:40 = KST 21:40 예산표2
  workflow_dispatch:
    inputs:
      series:
        description: "시리즈"
        type: choice
        options: [rank, budget, rank2, cash, budget2]
        default: budget
      fmt:
        description: "랭킹 형식(수동): highs·drops·cancels·hot·gu"
        type: string
        default: ""
      sido:
        description: "랭킹 시도(수동)"
        type: string
        default: ""
      eok:
        description: "예산표 억대(수동, 시도와 함께)"
        type: string
        default: ""
      band:
        description: "예산표 평형대(수동)"
        type: string
        default: "30평대"
      repeat:
        description: "최근에 올린 제목도 다시(수정판 재게시)"
        type: boolean
        default: false
      dry_run:
        description: "만들고 검수까지만(게시 안 함)"
        type: boolean
        default: true

permissions:
  contents: write                  # media 브랜치에 카드 이미지 올리기

concurrency:
  group: post
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  IG_USER_ID: "17841420258022268"  # @jipgapradar (비밀값 아님)

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: DB 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download db --pattern 'realestate.db.zst' --dir data
          zstd -d --rm -f data/realestate.db.zst -o data/realestate.db
      - name: 인스타 토큰 확인
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          echo "토큰 길이: ${#IG_ACCESS_TOKEN}자"
          r=$(curl -s "https://graph.instagram.com/v23.0/me?fields=user_id,username" --data-urlencode "access_token=$IG_ACCESS_TOKEN" -G)
          echo "$r" | python -c "import sys,json; d=json.load(sys.stdin); print('계정:', d.get('username'), d.get('user_id')) if 'username' in d else (print('토큰 오류:', d.get('error',{}).get('message')), sys.exit(1))"
      - name: 카드 만들기 · 검수 · 게시
        env:
          GH_TOKEN: ${{ github.token }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          S="${{ inputs.series }}"
          if [ "${{ github.event.schedule }}" = "40 10 * * *" ]; then S=cash; fi
          if [ "${{ github.event.schedule }}" = "10 23 * * *" ]; then S=rank; fi
          if [ "${{ github.event.schedule }}" = "40 6 * * *" ]; then S=rank2; fi
          if [ "${{ github.event.schedule }}" = "40 12 * * *" ]; then S=budget2; fi
          X=""
          if [ -n "${{ inputs.fmt }}" ]; then X="$X --fmt ${{ inputs.fmt }}"; fi
          if [ -n "${{ inputs.sido }}" ]; then X="$X --sido ${{ inputs.sido }}"; fi
          if [ -n "${{ inputs.eok }}" ]; then X="$X --eok ${{ inputs.eok }} --band ${{ inputs.band }}"; fi
          if [ -z "$S" ]; then S=budget; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m cards.post --series "$S" --dry-run $X
          else
            python -m cards.post --series "$S" $X ${{ inputs.repeat && '--repeat' || '' }}
          fi
      - name: 카드 이미지 보관(확인용)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cards
          path: out/cards/
          retention-days: 7
          if-no-files-found: ignore
